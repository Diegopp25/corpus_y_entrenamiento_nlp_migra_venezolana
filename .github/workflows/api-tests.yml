name: API tests

# Pruebas del API FastAPI en cada push/PR que toque api/.
# Los pesos BETO no están en el repo: el CI corre con el motor léxico y omite
# los tests marcados como `real_models` y `network`.

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Instalar dependencias del API
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar la suite de pruebas
        env:
          PYTHONPATH: .
          NLP_ENVIRONMENT: test
          NLP_ENGINE: lexicon
        # Sin pesos BETO ni red real en CI.
        run: python -m pytest tests -m "not real_models and not network" -q
